<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diet Recommendation</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/diet.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="diet-box">

        <h1>🥗 Diet Recommendation</h1>

        <p>Enter your height and weight to get your personalized diet plan.</p>

        <form method="POST">

            <input type="number" name="height" placeholder="Height (cm)" required>

            <input type="number" name="weight" placeholder="Weight (kg)" required>

            <button type="submit">Get Diet Plan</button>

        </form>

        {% if bmi %}

        <div class="result">

            <h2>Your BMI : {{ bmi }}</h2>

            <h3>Category : {{ category }}</h3>

            <hr>

            <h3>🍳 Breakfast</h3>
            <p>{{ breakfast }}</p>

            <h3>🍛 Lunch</h3>
            <p>{{ lunch }}</p>

            <h3>🌙 Dinner</h3>
            <p>{{ dinner }}</p>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
